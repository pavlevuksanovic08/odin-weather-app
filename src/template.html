<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./images/sun-logo.png">
    <title>Weather App</title>
</head>
<body>
    <div id="header">
        <div id="logo">
            <img src="./images/sun-logo.png">
            <p>Weather App</p>
        </div>
        <div id="search-section">
            <div id="search-bar">
                <input type="search" id="search" autocomplete="off" required>
                <div id="suggestions"></div>
            </div>
            <div>
                <button id="search-btn">Search</button>
            </div>
        </div>
        <div id="user-timestamp">
            <p id="time"></p>
            <p id="date"></p>
            <p id="day"></p>
            <p id="location"></p>
        </div>
    </div>
   
    <div id="main">
        <h1 id="city-name"></h1>
        <div id="cards-section"></div>
        <div id="main-data">
            <div id="secondary-data">
                
            </div>
        </div>
    </div>
</body>
</html>
